<VirtualHost *:80>
    ServerName voxlux.us
    ServerAlias www.voxlux.us

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    # Redirect to HTTPS only once the cert exists; until then serve plain HTTP
    # so the webroot ACME challenge and the site work without a broken 443.
    <IfFile "/etc/letsencrypt/live/voxlux.us/fullchain.pem">
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
        RewriteRule ^(.*)$ https://voxlux.us$1 [R=301,L]
    </IfFile>
    <IfFile "!/etc/letsencrypt/live/voxlux.us/fullchain.pem">
        DocumentRoot /opt/voxlux.us/dist
        <Directory /opt/voxlux.us/dist>
            Options -Indexes -MultiViews
            AllowOverride None
            Require all granted
        </Directory>
    </IfFile>

    ErrorDocument 404 /404.html
    ErrorLog ${APACHE_LOG_DIR}/voxlux.us.error.log
    CustomLog ${APACHE_LOG_DIR}/voxlux.us.access.log combined
</VirtualHost>

<IfFile "/etc/letsencrypt/live/voxlux.us/fullchain.pem">
<VirtualHost *:443>
    ServerName voxlux.us
    ServerAlias www.voxlux.us

    DocumentRoot /opt/voxlux.us/dist
    ErrorDocument 404 /404.html

    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/voxlux.us/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/voxlux.us/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /opt/voxlux.us/dist>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.voxlux\.us$ [NC]
    RewriteRule ^(.*)$ https://voxlux.us$1 [R=301,L]

    # GitHub owns the installer bytes and all release records/binaries.
    RedirectMatch 302 "^/install\.sh$" "https://github.com/robertelee78/vox/releases/download/v0.4.0/install.sh"
    <LocationMatch "^/install\.sh$">
        Header always set Cache-Control "no-store, max-age=0"
    </LocationMatch>

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/voxlux.us.error.log
    CustomLog ${APACHE_LOG_DIR}/voxlux.us.access.log combined
</VirtualHost>
</IfFile>
